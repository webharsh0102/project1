<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - RecEngine</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="auth-card">

    <div class="auth-header">
      <h1>RecEngine <span class="accent">🚀</span></h1>
      <p id="formSubtext">Sign in to access your personalized recommendations</p>
    </div>

    <div class="tab-switch">
      <button id="tabLogin" class="tab-btn active" type="button" onclick="switchTab('login')">Log In</button>
      <button id="tabRegister" class="tab-btn" type="button" onclick="switchTab('register')">Sign Up</button>
    </div>

    <form id="authForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required placeholder="e.g. harsh_dev" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div id="errorMsg" class="error-banner hidden"></div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Log In</button>
    </form>

  </div>

  <script src="login.js"></script>
</body>
</html>
